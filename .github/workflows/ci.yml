name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Install the packed tarball into a folder inside the checkout and run the installed copy.
      # Only relative paths are used: Git Bash on Windows rewrites absolute paths and PATH separators, which broke the old global-prefix version.
      - name: smoke test the packed package
        shell: bash
        run: |
          set -euo pipefail
          npm pack --silent
          rm -rf .smoke
          mkdir -p .smoke/app .smoke/home
          cp memory7-*.tgz .smoke/app/memory7.tgz
          cd .smoke/app
          echo '{"name":"smoke-app","private":true,"version":"0.0.0"}' > package.json
          npm install ./memory7.tgz --no-audit --no-fund
          test -f node_modules/memory7/dist/index.js
          export MEMORY7_HOME=../home
          node node_modules/memory7/dist/index.js --version
          npm exec -- memory7 --version
          node node_modules/memory7/dist/index.js doctor
          node node_modules/memory7/dist/index.js add "I use ${{ runner.os }}" --global
          node node_modules/memory7/dist/index.js search os

      - name: show what was installed (only on failure)
        if: failure()
        shell: bash
        run: |
          ls -la .smoke/app || true
          ls -laR .smoke/app/node_modules/memory7 | head -60 || true
          ls -la .smoke/app/node_modules/.bin || true
