name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # the packed tarball must install and run on a clean prefix, like a user's machine
      - name: smoke test the packed package
        shell: bash
        run: |
          npm pack --silent
          PREFIX="$RUNNER_TEMP/prefix"
          npm install -g --prefix "$PREFIX" ./memory7-*.tgz
          export PATH="$PREFIX/bin:$PREFIX:$PATH"
          export MEMORY7_HOME="$RUNNER_TEMP/m7home"
          memory7 --version
          memory7 doctor
          memory7 add "I use ${{ runner.os }}" --global
          memory7 search os
